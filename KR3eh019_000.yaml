body:
  text: 例言本書術語悉用我國通行名詞我國所未備者間採譯名書中詳述內科諸病分原因症候經過預後類症治法處方各節均用淺近文言即不知醫者亦可照法施治本書所用參考書古今中外共二十餘種必比較詳核而後編入書中處方分藥方特方二種藥方即我國古方特方即外國之普通藥方特方中之藥品均吾人可自制者採用既易效驗亦確且藥性和平決無危險之虞傳染病傷寒腸窒扶斯原因為腸窒扶斯桿菌其傳染由於飲食物飲料水糞便空氣等症候本病之潛伏期約十四日至二十一日初發全身倦怠飲食減少頭痛耳鳴睡眠不安之前驅症繼而惡寒發熱舌起白苔便閉或下痢甚至大渴引飲舌唇乾裂狂言舞跳神識朦朧脈搏在八十以上或及至一百三十熱度有一定之規定約每日上升半度至一周之終其熱遂達四十或四十一度稽留一周或二周日而發熱度漸降身體漸快食欲增進遂復於健康之域矣此外尚有變形者三種一輕症窒扶斯俗名小傷寒其經過之期間極短八日至十四日治二不全窒扶斯其發熱速而退熱亦速三逍遙窒扶斯發熱極微起居如常患者全不介意然於第二三周間或有便血而見危險症狀預後脈搏一百二十以上或脈力軟弱或脈不整或四十一度之高熱稽留不退或發重篤之合併症為不良在老人小兒產婦亦危險治法宜安臥靜養病房宜流通空氣不使有劇烈之光線射入食餌當用液體營養物即牛乳豆乳肉羹汁生卵可飲黃酒或葡萄酒輕症用少量重症用多量初期宜用輕粉瀉劑退熱劑不可妄用須至二周之終體溫四十度以上稽留未退者用之若熱甚高可用冷水纏絡法退熱後一二周日內不得食硬固之食物更當注意清潔病房常換被褥消毒衣服及糞便等藥方粉霜一兩輕粉五錢白麵六錢上水和蒸熟分為一百二十丸每服一丸至二丸此方根據於宣明方麻黃十斤去節杏仁四升去皮大黃二十八兩大寒雪煎上以雪水煎成乾燥膠質作丸如彈子大每以沸湯化服一丸日服二丸千金方以冰一塊置於膻中良上宜於第三周之後熱度未降神志昏迷者時珍以冷水浸布貼胸前上施用時間同前活人書麻黃一錢二分桂枝八分杏仁一錢二分麻黃湯上以水兩盞煮取六分服宜於喘而無汗頭痛發熱惡寒者仲景桂枝芍藥生薑各七分半甘草五分桂枝湯上以水一盞四分煎取六分服宜於上衝頭痛發熱汗出惡風者仲景厚朴枳實各二錢一分梔子七分梔子厚朴湯上三味以水一盞四分煮取六分服宜於胸腹煩滿者仲景黃連四分半夏一錢二分栝蔞實八分小陷胸湯上以水一盞八分煮取六分服宜於結胸仲景蕙草陵零香當歸各五分黃連一錢蕙草湯上以水一盞煮五分服日三服宜於下利範汪方特方輕粉一分三釐上作一次服本病之初期服之能下泄熱候之下降亦速明礬八分白糖四錢上為十包每時服一包宜於下痢及腸出血麝香一分三釐樟腦一分三釐白糖二錢五分上分六包每二時服一包宜於虛脫爛喉痧實扶的里亞原因為實扶的里亞桿菌傳染而發二至七歲之小兒易罹此症症候本症之局所病狀咽喉左右核及黏膜腫脹焮赤而痛生白色或微黃色之義膜顎下腫脹壓之則痛其全身病狀身體違和頭痛體溫高至三十九度以上嚥下困難病愈進則呼吸之困難愈甚而將窒息併發咳嗽骨節疼痛耳炎諸症亦有皮膚髮薔薇疹或紅斑者經過一二周日預後不定治法宜隔離患者清潔病房流通空氣含冰塊用冷罨法以電氣燒灼患部或以鉗鉗定棉花拭去義膜又含嗽淡鹽湯與石灰水可吸入熱蒸氣如現衰弱之狀宜與以黃酒或赤葡萄酒等之興奮劑高熱則宜用解熱劑近時發明之血清療法最為有效若施行過遲亦無益也其他若義膜固著氣管可送入金屬管於氣管之法藥方鮮生地四錢鮮石斛二錢鮮柳根白皮四錢苦甘草一錢薄荷葉一錢五分地骨皮三錢元參二錢丹皮二錢上水二盞煮取一盞服宜於發熱退熱劑瀉葉二錢大黃一錢五分芒硝二錢上水一盞五分煮取六分服宜於大便秘結者龍腦三分硼砂一錢膽礬五分兒茶一錢五分上研末吹入特方樟腦酒上十五分時塗布一次膽礬一錢三分白糖一錢一分澱粉一錢一分上分五包每十分時一包取吐石灰粉一分清水八十分上搖動二三分時候澄清含漱硼砂二分清水二分上吸入霍亂虎列剌原因由於虎列剌菌傳染所致其傳染之媒介為飲食物飲料水及患者之吐瀉物傳播飲食不攝生及胃炎感冒亦能誘起此症症候本病分類似霍亂單純霍亂真性霍亂乾性霍亂乾霍亂四種類似霍亂初發下痢次發嘔吐吐物及糞便之色類似米泔汁泌尿減少或絕止眼珠凹陷手足厥冷皮膚蒼白身體疲勞腓腸疼痛脈搏細弱輕者一二日即治重者數日死單純霍亂初發肚腹雷鳴一日下痢六七次身體倦怠食欲缺乏嘔吐煩渴尿量減少等數日即治或引續而成真性霍亂真性霍亂由於類似霍亂與單純霍亂引續而發或俄然特發者嘔吐下痢更甚一日有下至二三十次之多其色與前無異或稍混血液全身衰弱體溫下降諸筋痙攣聲音嘶啞大渴引飲眼球陷落呼吸困難四肢厥冷皮膚皺癟而殆無彈力且呈青藍色此後大抵經一日或二日而死或一二周而治乾性霍亂症候大抵與前相同惟不發下痢預後輕症良重症不良死亡之例百人中約五十人至七十人治法初起時即宜入隔離病房可服輕粉瀉劑以泄腸內容物而後用鴉片與興奮劑可溫包腹部甚者行鹽水或樟腦之皮下注射其他對症療法最為緊要預防本病流行時宜加意攝生飲料及食物必經沸度而後可病者之吐瀉物及汙染物速即燒棄或消毒又蠅類為本病傳染之媒介宜設法驅除之如身體稍覺不快即宜延醫療治藥方丁香七粒白豆蔻七粒小腹痛者加砂仁七粒神香散上為末清湯調下景岳黨參乾薑白朮甘草各八分理中湯上水二盞煮取六分服不瘥頻服仲景方黃芩黨參乾薑各八分桂枝三分姜半夏二錢大棗三枚黃芩湯上煮法同前外臺特方輕粉一分白糖五錢上分六包每二時服一包樟腦五分二釐薄荷油五分二釐酒精五錢二分上藥調和以二十滴浮於一杯之葡萄酒上黃酒亦可飲之阿片酒五分甘松酒二錢五分薄荷油五滴上每二時服二十滴阿片一分五釐高粱酒二十分上浸七日濾去滓加酒補足二十分每服十五滴日服三次瘧疾間歇熱原因為麻拉里亞之寄生物存在於血中發之而此寄生物由蚊屬一種即亞納非列斯蚊螫刺人體而傳染之症候本病每發一次分作三層一發冷而寒戰二發熱體溫達三十九度至四十一度脈大而數百搏至百二十搏三出汗汗後則體溫下降諸病消散惟身體衰弱尿中含有赤色之沉渣比重甚高又過若干時則其病又發有日發者有間日發者有間二日發者若久不治愈則身瘦面黃脾臟脹大併發腦氣筋痛等症預後良但惡寒瘧疾或有弛張性者頗難全治且此症多發於熱帶地方治法發冷而寒戰時行溫布摩擦法以溫暖身體又與以茶或湯等之溫飲料發熱時則可用冷罨法及清涼飲料此外在其發作之前與以退熱劑又病症持久者可用滋養強壯藥並行轉地療法藥方常山一寸草果一枚熱酒一杯上浸一夜早起服之劉長春經驗方柴胡八分黃芩黨參甘草各一錢半夏薑製一錢五分姜一片棗三枚上水二盞煮取六分服張仲景小柴胡湯地骨皮二錢防風一錢甘草五分姜一片地仙散上水煎服濟生方砒石二錢雄黃四錢棗肉一兩二錢上為丸如卜子大每日服一丸驗方特方黃連一錢蘇木一錢上水一盞煎至四分服日服二三次砒石一毫之十分之三黑胡椒末一分三釐樹膠適宜上為十丸早餐服一丸宜於久不愈者赤痢原因由於不潔之飲食物飲料水衣服之交換便廁感冒及胃加答兒胃炎腸加答兒腸炎論其究竟則為赤痢桿狀菌傳染所致症候全身違和腹痛惡寒發熱食思缺損下痢頻次泄黏液或混血膠狀之大便與觸鼻之惡臭然其量極少不能快通故感里結後重肛門灼熱痛苦不堪一日竟有二十至七十次之多小便減少舌生白苔重者發熱特甚食物不進腹痛異常舌苔煤黑眼球陷落聲音嘶啞以致衰弱而死否則變為慢性赤痢是症不問老幼均不得望其全快預後從其流行性良否不同惟衰弱極老人小兒最為危險治法主對症療法慎飲食命安臥靜養病室須流通空氣清潔患者之周圍嚴行消毒宜行半身浴或下腹溫罨法而先投以下劑使便通既得十分之排便即可用收斂劑或止瀉劑預防飲食宜攝生衣服宜清潔身體宜勤浴住屋宜乾燥食物及水必經沸度而後可瓜果涼水及冰水不可食汙水不可洗衣精神及身體不可過勞食物不可過量便時宜擇清潔之坑廁有泄瀉及感冒即宜醫治病房非看護人不宜入內病人食物之杯盤及病人排泄之糞便宜用石灰水嚴行消毒藥方廣瀉葉一錢元明粉二錢姜一錢橙皮一錢上以水二盞煎五分服黑牽牛五分白牽牛五分生研上為一次吞服甘草湯下每日三服瀉劑奏效後可用下方檳榔二錢白礬二錢肉桂二錢龍骨二錢上研細末分作十包每服一包日三服山楂炭二錢粟殼三錢檳榔一錢五分石榴皮二錢青糖不拘上水二盞煎五分服近世驗方訶黎勒一枚訶黎勒散上一味煨熟研末米飲和服金匱特方蓖麻子油上以二三錢服之三時間仍不快則可再服一錢此油之製法用蓖麻子五斤冷水泡一日用沸水煮二句鍾去水日中曬乾搗爛加水十斤再用火煮之屢次攪動至油質上浮收取用之市中所售者均屬不佳不可入藥大黃粉五分滑石粉五分桂皮即肉桂五分上為細末作一服日三四服宜於小兒沒石脂一錢阿片一分白糖二錢上分作十包每一時服一包宜於瀉劑奏效後樟腦一分阿片一分薄荷油一分火酒精二兩上浸出每服十滴至二十滴宜於虛脫麻疹原因傳染力極為強大惟多襲於小兒一發此症後再發者甚稀而傳染之媒介為淚液咯痰呼氣唾液皮膚蒸氣及空氣器具等症候本病之潛伏期約五六日以至十日其初成三四日間則體溫升達三十八九度發譫語噴嚏流淚乾咳其後為發疹期則體溫升至三十九度五分以至四十一度始見發疹最初見於眼之邊傍或顏面次則蔓延於頸及軀幹四肢皮膚呈紅色或稍帶藍色經一二日則體溫下降赤疹稍蒼白至第三日或第四日悉行消失至第六七日此時身體雖全快惟身上之皮膚剝脫而成粗糙之形本病發起後大抵經八日或十日而得全快類症風疹發疹窒扶斯梅毒疹等預後概良治法此症單純者可不用藥劑以待期療法為最要即命安臥靜養平均溫度列氏七十五六度流通空氣溫和身體切勿與以寒冷之飲食品病室宜幽暗大便不通者可用輕瀉劑平日可用和緩劑或退熱劑其他有合併症宜各施行適宜之治法預防隔離病兒與康健者接近然此症如能於四五歲至八九歲之間傳染善性之麻疹則他日可以免惡性傳染之憂亦可為不幸中之幸也藥方西河柳一握約三錢上水煎服一日二次薄荷防風連翹牛蒡子荊芥大青黃芩黃連上分量隨年齡酌定水煎服之葛根升麻芍藥甘草升麻葛根湯上同前特方蓖麻子油一錢三分一歲以上小兒之所用分量上浮於水面或茶上服之宜於便秘遠志四分阿片酒二滴糖漿四錢清水通宜上一日六次二日分服梅毒原因此症有先天后天之別先天由父母遺傳而發又名遺毒後天由於交結或接吻或患者之煙管茶杯等均為本病之媒介症候先天梅毒發全體羸弱鼻孔充塞足蹠及肛門周圍呈赤色而有光澤後天梅毒之潛伏期分為數期第一期之病狀始成硬性下疳男子在於龜頭等處女子在於大陰唇等處生硬結節有時潰爛而出膿汁經數周後頗似治愈隨續發便毒其始鼠蹊腺或無痛性橫痃繼則頸及腋下等之腺亦腫經二三周時間則惡寒發熱諸關節劇痛由是而移至第二期本期為梅毒發疹期則寒熱頭疼四肢疼痛貧血不眠神經衰弱外皮發梅毒性薔薇疹為紅色之斑點多呈圓形比皮膚之表面稍高壓之則退色及梅毒蕾疹為小豆或豌豆大之紅點多發於顏面梅毒性乾癬所患之部則呈白色而有光澤之鱗片多在於手足掌上扁平贅肉皮膚上現扁平之隆起宛如覆以黏稠灰白色之沉著物其惡臭特著此時傳染性甚強多生於陰莖下面與陰囊之交界及陰囊與大腿之交界間或大小陰唇肛門周圍鼠蹊部臍窩鼻唇溝口角指趾等處梅毒性小膿泡疹大膿泡疹膿泡成後潰爛甚深有痂皮為表在性此外之皮疹種類甚多或生如胡桃之硬結節續流膿汁或罹眼病而至盲目第三期梅毒之特有症狀則發皮膚與筋肉之護膜腫與骨膜腫頭骨四肢骨鼻骨發劇痛鼻骨尤甚或鼻之全部全行消失更甚者波及內臟竟有釀成生命之危險亦有發脊髓實質之護膜腫惟甚希耳治法先天梅毒宜禁與母乳而與以滋養之物品口內陰部肛門行清潔法施局部及全身療法宜預防傳染於家族為要後天梅毒宜取易於消化而富於滋養之食物切戒飲酒及房事如在第一期之時間宜預防第二期之發疹侵襲即口內炎皮脂漏脫髮濕疹足汗齲齒胃痛及習慣便秘之療法切勿可忽如行水銀療法時其口腔宜嚴厲保持清潔每日用淡鹽湯含漱數次藥方川萆薢一兩上以水三盞煎至二盞不拘時徐徐溫服土茯苓八錢水十兩上煎汁一日數次分服茯苓三錢木通三錢金銀花三錢川芎一錢大黃三錢甘草一錢土茯苓一兩上水二合煮取一合作二次服輕粉大楓子肉上等分研勻塗之嶺南衛生方輕粉一錢胡桃仁二錢炒槐花二錢上棗肉為丸分作九服三日服盡楊誠經驗方特方水銀軟膏上輪流塗於胸側上膊大腿等處明礬四分餾水二兩上含漱劑淋病原因由於與不潔之婦人交接傳染淋病球菌所致症候此症有急慢二性之別急性者與有本病之婦人交接後經三日呈尿道焮赤腫痛尿意頻數尿中常帶膿汁放尿時發劇痛在男子則陰莖腫熱在女子則陰唇紅爛再經數日則膿汁之量益增經五六周後或可粗治若治療不適則成為慢性殆無疼痛仍漏少量之膿汁不易治愈治法預防此症之法宜束身自好絕跡青樓切戒故意延長之交接或中止之若已發此症後則命安靜身心守攝生嚴禁酒類與刺激性飲食品用緩瀉劑行冷罨法屢屢清潔其陰部並宜戒房事正品行為至要也藥方赤苓三錢白芍山梔各二錢當歸甘草各一錢四分上水一盞五分煎八分服五淋湯滑石二錢木通茯苓車前瞿麥各一錢上水一盞煎五分服特方蓽澄茄末八錢上為二十包一日三包檀香油上日服二三十滴明礬一分茴香水二百分上注入尿道膽礬一分水一千分上注入劑用於慢性淋疾癩病麻風原因由於癩病桿狀菌而發其傳染性極弱雖夫婦亦少傳染或謂遺傳而發本病者頗多症候此症有斑紋癩神經癩結節癩三種之別斑紋癩全體發大小不同之斑紋呈赤或紫或褐色皮膚失其知覺或發生潰瘍神經癩初發知覺過敏及神經痛而後知覺消失運動麻痹營養障害毛髮脫落潰瘍壞疽漸及於骨與關節之間其手足與指宛如失去之狀結節癩先發紅赤色之斑紋於四肢關節及手掌足蹠之間經數月或一年後其顏面生如粟米或豌豆大之硬節此後皮膚轉黃毛髮脫落結節潰瘍此時雖似花如玉之美人一變而為不堪之醜態經過六年至二十四年類症狼瘡梅毒性結節預後不良治法本症雖世界名醫均無療法近時之治法以內用大楓子油外行硫黃浴十人中或可治愈二人或注射大楓油於臀部又施燒灼或灸點或施電氣療法潰瘍可用制腐藥藥方大楓子油一兩苦參末三兩上酒糊丸梧子大每服五十丸空心溫酒下外以苦參湯洗之普濟方特方大楓子油一錢五分上為丸一日二次分服大楓子油椿油等分上注射臀部呼吸器病感冒原因本病由於冒寒冒濕體溫不調或垢汙留積有流行性者或謂本病系黴菌傳染尚未明確曰流行性感冒症候惡寒發熱熱在三十八度以上鼻孔閉塞或流清涕頭痛咯痰咳嗽咽喉痛楚甚者或發譫語聲音嘶嗄呼吸苦促治法預防此症之法避冒寒冒濕冬日早起戒外出用發汗劑行蒸氣浴其他用下方藥方香白芷一兩荊芥一錢上為末每服二錢溫茶下百一選方川芎荊芥各四錢薄荷八錢白芷羌活甘草各二錢細辛一錢防風一錢五分上為末食後溫茶送服二錢日服三次川芎茶調散紫蘇葉三錢陳皮川芎蔓荊子防風秦艽荊芥各一錢五分甘草一錢姜三片蔥白三枚上水二盞半煎一盞溫服蓋被髮汗加味香蘇飲特方遠志根一錢三分溫湯二兩六錢上煎十五分時加糖適宜作三次一日服盡肺勞肺結核原因本病之真原為肺結核桿菌常生活於咯痰呼氣中凡人偶吸此菌則直竄肺中之組織逐漸繁殖肺臟遂為所傷而成肺勞若以病者之咯痰令動物食之則必發本病其他為體質衰弱營養不良房勞過度手淫憂鬱外感等症候初發身體瘦弱面色光白胸膈變窄時有干嗽初早起咳嗽後晝夜俱嗽行路氣促用力後面色發紅上山登樓氣促特甚咯血稠痰亦有咳血者脈甚數每一分時約一百至此時左右肺葉其上半已有多粒成塊尚未腐爛次則咳嗽漸增常有松痰脈極細弱呼吸愈促常發潮熱顏色鮮紅晨起多冷汗熱度漸退言語有沙聲或啞咽喉發炎胸膈常痛此時肺胞膜已有發炎處也大便溏泄時有瀉利最為危險此時結核菌已侵入腸內也舌苔紅色穀氣或佳或不佳身愈瘦弱久則精力耗散而死經過數月或數年預後不良治法宜移居於郊外或海濱呼吸新鮮之空氣眺野外之風景食滋養之物品行適宜之運動飲少量之黃酒行深呼吸施海水浴冬季轉移於和暖之地早起宜遲宜廢止使用腦力之事如有發熱症候亦無須禁止旅行若肺之組織非常傷損而已成為空洞者則命安靜療養轉地旅行反為有害但至此時期雖有極高明之醫士僅能用法緩其死期而已蓋本病實無確效之根治藥品然有不得不用藥品之時則施行對症療法如咳嗽則投以鎮嗽劑發熱則投以解熱劑胃弱則投以健胃劑虛弱則投以強壯劑等且患本病之唾壺必須消毒酒精或生石灰加以覆蓋以防咯痰之乾燥飛散清潔病室及衣衾手巾及飲食器具亦須時常消毒勉戒接吻預防防本病之法莫妙於多吸空氣多見日光行適宜之運動使強壯其身體凡遇患本病之友朋切勿與其對坐談笑吸其呼出之氣手巾面盆及飲食器具不得互換使用又小兒不可用結核性母乳藥方蘆根麥冬地骨皮生薑各一錢梔皮茯苓各五分上水二鍾煮八分溫服蘆根飲百部根二十斤上搗取汁煎如飴服方寸匕日三服深師加蜜二斤外臺加飴一斤宜於咳嗽特方銀耳五分白糖適宜上水煮服蘇木膏一錢三分阿片番紅花酒二分六釐薄荷水四兩橙皮糖漿二錢六分上二時服一調羹下利杏仁水一錢五分糖漿四錢上每二時服一調羹黴麥一錢五分水二兩六錢上為浸劑一日六回二日分服咯血龍膽草二錢六分水四兩浸出橙皮糖漿五錢上每二時服一調羹咳嗽原因本病為氣管支加答兒有急慢二性之別急性者由於感冒其他別由吸入煤煙與刺激性之瓦斯營養不良肺結核之遺傳流行性感冒猩紅熱麻疹天痘及心肺諸病慢性者為急性症之延緩不愈多發於演說唱歌及嗜酒者其他為肺氣腫肋膜炎氣管支黏膜刺激經久腺病性武雷篤病或慢性肺炎結核炎性刺激之波及等症候急性症必發之症候為惡寒發熱食慾不振身體疲倦脈搏增加咳嗽不已繼則咯痰初時少量黏稠後為多量稀薄慢性症連發咳嗽繼則嘔吐喘息咯血呼氣咯痰或放惡臭預後急性者頗易治愈慢性者輕而延緩類症急性類似肺炎乾性脅膜炎慢性類似肺結核肺壞疽治法急性與慢性治法無甚相異宜戒多言進暖和性之飲料室內衣衾宜平均溫度行溫水浴胸部纏以佛蘭絨吸入食鹽水之蒸氣呼吸促迫之時則貼干角芥子泥於胸部或背部行轉地療法移居於溫熱之海邊其他用鎮嗽劑祛痰劑若有虛脫之虞則可用葡萄酒精製樟腦麝香等藥方百部二錢姜一錢上水煎服葛洪方桔梗二錢甘草一錢上水一盞煎五分服桔梗湯麥門冬三錢製半夏二錢黨參一錢五分甘草一錢大棗一枚粳米一撮上水二盞煎一盞服麥門冬湯紫蘇一錢桑皮二錢青皮一錢五味子五分杏仁二錢麻黃五分甘草一錢上水煎服紫蘇散特方遠志一錢五分溫湯一盞上煎五分時一日三次分服麻黃膏四分甘草末適宜上為丸一次服盡漂半夏五分遠志一錢杏仁八分上為散三包一日服盡遠志二錢八分沸水五兩浸出醋蜜四錢淨水二兩五錢上每二時服一調羹咯血肺出血原因為肺勞肺體變死肺炎新氣管支加答兒風寒咳嗽肺鬱血肺臟揳狀出血等症候初發咳嗽及其溫液湧湧於胸內然後咯血其血液呈鮮紅色混有泡沫呈亞爾加里性揳狀出血則突然起強甚咳嗽呼吸困難胸中苦悶咯特異之痰痰中有帶黑色之血身體熱度不升治法當以治療原病為第一義其他使患者平臥安靜身心胸部用冷罨法或罨冰片禁談話及溫食物戒酒色及精神興奮嚴攝生用空氣療法食滋養品藥方款冬花二錢百合二錢百部二錢上研末蜜丸如龍眼大每晚服一丸荷葉四錢上焙乾為末一日二次分服黃耆麥冬生地桔梗白芍各一錢甘草八分上水煎服黃耆散紫苑一味上炒為末蜜丸芡子大每服一丸指南方槐花三錢上炒研為散米飲下朱氏方特方黴麥膏四錢水二兩六錢橙皮糖漿七錢上每二時食一匙芥子末適宜上溫湯調和施行手浴百日咳連聲咳原因有一種特異之病毒傳染而發其傳染之媒介為咯痰與衣服或久感寒冷本病多發於二歲至七歲之小兒至十歲以上則其感受性驟減成人則無之症候初起之時則發尋常咳嗽次發發作性痙攣咳嗽氣管內若癢若痛氣促噴嚏髮長且深之吸息次發短呼吸一日約三四次至二三十次重者六十次至一百次痰色暗而帶強黃色吐痰之時每連食物吐出後則漸漸回覆窒息減少咳嗽咯痰亦少終而治愈經過二月至七月預後良但發肺炎之合併症則不良治法行轉地療法為最良宜常出戶外吸新鮮之空氣初期用鎮嗽劑一日行二次之溫浴又施濕布繃帶用佛蘭絨浸於溫湯後置於胸部外以油紙蓋之再施行繃帶此法最有效驗又發作時介抱小兒使咯出黏痰平均病室溫度選易於消化之食品勿與以有刺激性之飲料又須行鼻孔檢查藥方牛蒡子二錢山稜一錢射干一錢花粉一錢五分杏仁一錢五分細辛八分青黛五分麻黃四分白蜜二匙上水煎服生明礬一錢生蜜四錢上調和服少許百花礬生薑汁半杯白蜜二匙上沸水沖服三四次特方明礬五釐水五錢橙皮糖漿五錢上一日四次每次一小食匙莨菪根末八釐白糖四錢上為三包每日三服用於痙攣若瞳孔散大者宜忌循環器病心忪神經性心悸原因多起於神經病神經衰弱歇斯的里貧血依卜昆垤兒手淫過房酒之濫飲或胃病及生殖器病之反射作用症候以神經性心悸為主症脈搏增加一分時達於一百四十以上併發胸部苦悶心動不整顏面蒼白耳鳴眩暈失神潮熱諸症經過及預後概良或有頑固性治法當施行原因療法貧血則服鐵劑多血則減其食量發作時可行心部冷罨法與溫水浴藥方辰砂研五分黃連五錢當歸三錢生地三錢甘草二錢上為末酒糊丸如麻子大每服三十丸特方莨菪膏三釐乳糖四錢上分四包一日四次每次服一包真心痛心臟痙攣又名絞心症原因為冠狀動脈硬化大動脈瓣閉鎖不全及筋肉僂麻質斯大動脈始起部之動脈瘤其他發於暴酒吸菸等症候胸骨下際及胸部發收縮性劇痛兼有苦悶及窘迫之感覺其疼痛如抽割絞榨波及於肩胛頸及上膊指尖其發作倏來倏去每次無過一句鍾以上發時面色青蒼皮膚黏汗四肢厥冷六脈細小其他心動心悸心音幽微且多發於夜間經過三四分至一二時間且每多再發預後頗不一定雖無險危之虞但不易治愈治法宜施原因療法而發作時浸潤布片於芥子精或芥子油以摩擦心部及上肢有心臟衰弱之兆宜服樟腦赤酒等之提神劑其他服鎮痙劑間歇時行冷水洗滌法室內空氣宜時常交換飲食宜擇易於消化之品並調宜便通藥方桂心八分生薑三片飴糖三匙上沸水沖服二三次千金三物湯丹參一兩檀香一錢砂仁一錢上水煎服程福堂公選良方特方麝香酒上一日數回每回十五滴乃至二十五滴阿魏酒上一日三回每回二滴乃至三十滴消化器病鵝口寄生性口內炎原因由於乳房不潔而發或發於一種黴菌之侵襲多起於營養不良之小兒症候口內灼熱口腔及軟口蓋之黏膜多生白色乾酪樣之小義膜漸次滋蔓重者波及咽喉食道局部充血腫起妨害咀嚼嚥下經過一二周日預後良治法預防此病之發生每次哺乳後以濕布屢拭口腔全部哺乳器亦須保持清潔成人為慢性症者則洗滌口腔更宜加意也藥方硼砂粉一分蜂蜜一錢上混和為塗布劑白礬一錢辰砂三分上為末日敷三次普濟方特方硼砂一錢三分水二兩六錢上含嗽劑硼砂一錢三分薔薇水五錢玫瑰蜜一兩沒藥酒五錢上口內塗布喉痹扁桃腺炎原因本症多發於寒冒與直接刺激咽頭如吸菸飲酒之類其他如猩紅熱麻疹梅毒丹毒瘧疾等均有本病之誘因症候扁桃腺腫起疼痛發嚥下困難妨害呼吸開閉不隨流涎發熱等症經過及預後與咽炎同治法輕症咽部行冷罨法用含漱劑重症使含咽冰塊用塗布劑貼水銀軟膏或硬膏於頸部若屢發則可切除扁桃腺惟此法非醫生不能施治也藥方食鹽白礬上炒枯研末點之燒鹽散膽礬醋上調灌之齊東野語桔梗甘草升麻連翹防風牛蒡子黃芩各一錢上水煎服紫蝴蝶花根一錢黃芩甘草桔梗各五分奪命散上為散水調服便民方藥方明礬一兩薄荷腦五釐上分二十包每包以水二合至三合溶解含漱明礬一錢三分水二兩六錢阿片酒二分六釐玫瑰蜜五錢二分上含漱劑蜀葵根二錢五分水二兩五錢上煎作含漱劑咽炎咽頭加答兒原因急性症為機械的溫濕的化學的刺激如飲酒吸菸吸有害瓦斯用腐蝕藥及過度之發聲或長時談論與寒冒唱歌等又續發於近鄰諸部之炎症慢性症原因與急性同且續發心肺諸病與一般鬱血症症候急性惡寒發熱頭痛食欲減少嚥下及談話困難疼痛流涎咽頭黏膜潮紅腫起扁桃腺增大或生細小之淺表潰瘍重者其疼痛甚劇烈如灼如刺嚥下時尤甚慢性疼痛減少僅覺咽頭乾燥及灼熱瘙癢頻發乾嗽黏膜潮紅肥厚小靜脈擴張蜿蜒等經過急性數日至一二周日慢性數年或至終身預後急性良慢性總難治愈治法急性使含冰塊屢行藥劑吸入或含漱行溫罨法用解熱劑發膿瘍則宜行亂刺或切開慢性禁吸菸飲酒用含漱劑若腺若贅殖則可行搔抓術或電氣燒灼急性用下處方牛蒡子連翹荊芥防風生梔桔梗玄參黃連金銀花黃芩薄荷甘草大黃朴硝各一錢上水二鍾煎八分食後服清咽利膈湯玄明粉硼砂各五錢龍腦五分辰砂六分上吹入特方膽礬一分三釐蒸水一兩五錢糖漿四錢上每十分時服半食匙催吐硼砂四錢糖漿八錢上每時服一食匙開水適宜調和服用或含漱阿片膏三毫至三釐水二兩六錢上吸入慢性用下處方天冬麥冬各二錢黃芩一錢生地三錢鮮石斛一錢五分甘草八分上水二鍾煎八分食後服加減甘露飲特方明礬五分水五兩上吸入明礬二分六釐至二錢六分白糖二錢六分上吹入沒石脂四錢沸水五兩上泡為含漱劑走馬牙疳水腫原因發於窒扶斯間歇熱或急性發疹病等滋養不良之小兒多發是病症候口唇及頰生小結節外堅內潰破潰處現暗黑色外面亦陷壞疽結干痂同時蔓延四處全身症候初發惡液汁身體發熱足部浮腫下痢虛脫等經過一二日至三四周日預後速治良若失其時機則不良治法施滋養強壯療法以治惡液及貧血局部療法則貼烙白金用防腐性含漱料其他可用解熱劑葡萄酒等藥方荊芥一錢五分防風枳殼各一錢黏子二錢當歸一錢五分小青草三錢上水煎服簡方錄梧桐淚黃丹上等分為散吹入醫林集要五倍子青黛枯礬黃柏等分上為散先以鹽湯漱淨吹入便覽橡斗殼鹽同煅麝香上為散吹入全幼心鑑特方硼砂二分六釐玫瑰蜜二錢六分上塗布劑食傷胃加答兒原因急性為暴食過飲與不消化之食品及腐敗肉類或食品寒熱過度其他魚菌中毒腸炎波及與外傷等又或為劇烈熱性病之前驅症慢性續發於急性食傷之後或因飲食不攝生其他貧血萎黃病胃癌胃潰瘍胃鬱血均與本病大有關係症候急性為食思缺乏漸次增進則發熱頭痛睡眠不安四肢疲倦舌苔無味嫌厭食餌煩渴噯氣噁心嘔吐胃部覺壓重飽滿知覺過敏下痢或便秘及口氣惡臭尿量減少等慢性略與急性同其胃部之血行障害胃液減少或增加食少許之食餌即覺飽滿或壓重鈍痛次發酸性噯氣其餘除一般營養減損外無特種之變常經過急性數時至二三周日慢性數月至數年預後良類症慢性類似胃癌及胃潰瘍治法急性宜檢查胃中有多量之不消化物或腐敗物等之存在者宜用吐劑或一二日間不與飲食或僅用易於消化之流動物務令鎮靜胃機作用或行胃洗滌已過時期則用下劑施冰塊嚥下胃部冷罨法內服藥當投以苦味劑或健胃劑麻痹劑慢性宜治療原病調節飲食且久使實行之禁食含脂肪之食品苛烈物酒類豆類及制咸蔬菜可用適當之食餌如乳汁雞卵無脂肪肉羹汁及粥汁等坐業者宜野外散步每日調理便通貧血則與以鐵劑其他行器械的療法按摩法冷水療法等藥方丁香乾薑甘草各五分莪朮陳皮青皮各一錢沉香砂仁各八分上水煎服丁香湯特方龍膽草膏五分薄荷油二分水二兩五錢上一日三次每次二食匙蓖麻子油四錢上頓服大黃膏二分六釐上為丸頓服苦味酒八錢番木鱉酒十滴上一日四次乃至五次每次十五滴至二十滴漂半夏二錢六分水五兩煎生薑糖漿五錢上一日二次分服菖蒲根二錢六分水五兩糖漿四錢上每二時一食匙滑石粉一兩五錢甘草二兩大黃一兩甘松五錢藏紅花一錢茴香一錢五分上為散一日三回每次一小刀尖糖水調和服用甘草四錢大黃八錢茴香四錢益智一錢上酒浸一日濾液十兩每次一二茶匙胃痛胃痙原因本症女子較多於男子因神經衰弱月經異常藏躁子宮病手淫貧血痛風間歇熱脊髓病及過用茶酒與煙其他胃潰瘍胃癌胃加答兒等症候胃部發異常之劇痛波及於胸背兩部重者連發至七八日之久上腹脹出脈搏頗細顏色蒼白苦悶不可言狀其最甚者則不省人事經過一次之發作其時間極短然經過則因原病而不同類症肋間神經病膽石疝腸管疝痛腹筋痛限局性腹膜炎預後良治法行原因療法守食餌攝生疼痛用鎮痙劑胃部塗芥子泥或發泡膏其他原因於手淫者行冷水按摩高地轉養海水浴等或飲黃酒一杯便佳痛甚者令患者伏臥自背後壓迫脅腹或以懷爐熱其患處藥方吳茱萸陳皮黃芩各五錢蒼朮七錢五分黃連一兩上為末麥糊丸桐子大每服十丸至二十丸日服二三次丹溪咽醋丸特方薄荷油一分二釐甘松酒五錢上以二十滴混和於糖水中服之番木鱉酒一錢苦味酒二錢上一日三次每次十滴薄荷油一分高粱酒十分甘松酒五分上一次服二三滴泄瀉腸加答兒原因因暴飲暴食與多食不易消化之食及未熟果實或氣候變更用強烈下劑及急性胃加答兒等其他為中毒蛔毒傳染病腹膜炎等而小兒最易罹本症症候發腹部雷鳴即起下痢排稀薄粥樣或黃綠之液汁及不消化食物一日二三次乃至十次以上尿量減少尋常雖不發熱然亦有發熱而類似窒扶斯者又併發急性胃加答兒則起嘔吐侵大腸則發疝痛或下痢已止而仍覺裡急後重下腹劇痛本病有慢性者由急性移轉而成其病狀雖與急性相似然不若急性之劇烈而治愈非易也經過急性數日慢性數月至數年類症腸窒扶斯赤痢霍亂預後成人良小兒重症不良治法命安臥腹部裹以絨布使之溫暖施溫浴溫茶劑澱粉灌腸黏滑飲料等均可適宜用之若原因在飲食物則投以下劑宜食清淡及流動性之食物如牛乳等或施飢餓療法一日間絕其飲食腹痛施以鎮痛劑燥秘施以蓖麻子油灌腸嘔吐可含冰塊虛脫用興奮劑其他愈後之食餌衛生成人小兒皆為必要固無待言矣藥方檳榔白芍枳實厚朴大黃生薑各一錢上水煎服檳芍順氣湯罌粟殼五錢陳皮一錢五分肉豆蔻炮姜炙甘草木香各一錢紅棗三枚上水煎服固腸散黃連石榴皮地榆阿膠各二錢當歸厚朴乾薑各一錢五分上水煎服千金黃連煎厚朴五分車前子焦白朮各三錢上水煎服濟生良方集特方蓖麻子油四錢至五錢上浮於溫茶一鍾頓服大黃酒一錢五倍子酒五分上混和一日三次每次十五滴胡椒末一錢硫磺華二錢上以葛粉為丸作一百八十丸每服三十丸一日三次樹膠漿二兩阿片一釐上每時一食匙明礬一分茴香水二兩六錢上每一時一小兒匙小兒吐血胃出血原因為胃充血胃潰瘍胃癌月經不調或腐蝕藥入胃等症候發胃部壓重痞滿嘔吐暗黑色之血液內含有食物殘渣經過及預後由原因而不一定類症咯血治法免此病之法預防胃潰瘍及心肝諸病禁過食飽飲劇熱物刺激物調整月經已出血者則令平臥褥中安靜身心嚴禁食物含咽冰塊或施冰罨法於胃部飲用冷乳數日後用易於消化之流動食物失神者顏面噴注冷水其他不能自口腔嚥下食物可施滋養灌腸一日二三次藥方生地黃不拘多少上水煎如飴為丸如彈子大每服一丸日二服千金地黃煎槲葉二錢上水煎服簡要濟眾藕節荷蒂各七枚蜂蜜一瓢上水二鍾煎八分服聖惠特方明礬五分阿片一毫三桂皮末二分六釐上為六包每十五分時服一包明礬五分水五兩糖漿十兩上每五分時服一茶匙小兒便血腸出血原因為赤痢窒扶斯癌腫器械的出血中毒異物結核性濾泡性加答兒性潰瘍十二指腸潰瘍動脈瘤直腸炎等症候或便秘或下利其糞便中混有赤色或紫黑色之血液治法施原因療法外宜用無刺激性之食料即乳汁雞蛋肉羹汁局部貼冰囊又對於大腸出血可注入冰水於腸內藥方炒槐花炒側柏荊芥炭各三錢枳殼二錢黃連一錢上為末烏梅湯送服二錢樗白皮五錢生地三錢炒銀花白芍茯苓各一錢五分地榆炭二錢丹皮一錢上水煎服特方黴麥膏二錢六分餾水一兩三錢上半筒至一筒行皮下注射秘結便秘原因為神經衰弱思慮太過或不消化性粗食及收斂性食物腸胃等有障害膽汁分泄減少腸管狹窄閉塞其他為腫瘍妊娠貧血與發汗泌乳排尿過多等症候糞便須二三日乃至七八日一通身體不舒腹部壓重緊滿精神倦怠甚者發眩暈心悸或因此而起痔疾與吐糞症經過及預後由原因而不一定治法施原因療法外宜節飲食行適宜之運動以冷水摩擦腹部或臨臥時以溫水浴腰部以下或下部按摩及礦泉療法或坐藥藥方芒硝大黃各二錢枳實一錢上水煎服大承氣湯生地汁一杯大黃二錢甘草一錢上水煎服千金翼大便不通方特方蓖麻子油一兩三錢上服一茶匙或一食匙但可加用麥酒肉羹汁或茶湯大黃末蘆薈各一錢三分蒲公英膏適宜上為五十丸每早服四丸瀉葉三分滑石四分硫黃華二釐茴香油糖一分五釐上為末作一次服絛蟲原因由食含此囊蟲及含蟲卵之生肉或半熟之肉而發其有鉤絛蟲寄生於豚犬鹿猿之肉中無鉤絛蟲寄生於牛肉擴節裂頭絛蟲則寄生於鮭鱒等魚肉中症候為思食缺乏起噁心嘔吐疝痛流涎鼻孔發癢瞳孔散大時發怔忡或便秘下利耳鳴身體衰瘦經過遲緩預後良治法服驅蟲藥之一日或半日前不可與以飲食物總以空腹為良故用藥前後與以緩瀉劑及茶或肉羹汁次日飲茶或咖啡少許而後用驅蟲劑二時間後又可用蓖麻子油但幼兒或衰弱小兒不可行驅蟲法若稍年長小兒體質強壯且無下利者用之無妨藥方石榴根皮五錢上水煮汁和粥空心服之崔元亮海上方烏梅一枚老薑二片榧子十枚花椒十四粒黑糖二錢上水煎服公選良方特方石榴根皮膏二分薄荷糖一錢蜂蜜適宜上為舐劑分三次服服後可服蓖麻子油十二指腸蟲原因此症由於誤飲不潔之水所致因此蟲卵往往生於汙水中其飲入後即繁殖於十二指腸且此蟲非肉眼可能檢視熱帶及卑濕之地發此症者甚多症候為身體疲倦筋肉瘦削及貧血頭痛心悸耳鳴等預後良治法此症可用石榴皮根煎與輕粉蓖麻油等瀉劑其他貧血則用滋養物或鐵劑或砒石劑藥方輕粉一分砂糖適宜上和丸如麻子大空腹米飲下一丸驗方榧子使君子各五枚上同時服公選良方特方石榴皮根一兩六錢水二十四兩上浸一日煎沸以煎取水之一半為度大人每服一茶杯小兒照減蓖麻子油五錢薄荷油十滴上頓服蛔蟲蛔蟲原因由含蛔蟲卵之糞便作肥料擁於野菜人取而生食之或雖煮而未熟者及各種果物食之亦易染此症症候大人概不現病狀小兒則發頭痛眩暈腹痛噁心嘔吐早起瞳孔散大下痢舌苔鼻孔肛門發癢面貌蒼白時起搐搦等預後良治法用驅蟲劑或松香油石灰水之灌腸藥方使君子十枚上空心作一次服小兒減服楝根白皮二錢上煎汁加米飲服集簡方特方松香油即新松脂或松枝蒸出之自散油質一錢三分卵黃一枚水五兩上為乳劑灌腸石灰水二錢水二兩五錢上灌腸脾胃虛弱消化不良原因為一般之神經病如臟躁多憂神經衰弱或暴食暴飲菸酒過用與手淫過房貧血萎黃病肺勞腸蟲瘧病月經等症候發精神鬱悶脫力頭痛上腹部壓重緊滿噯氣嘔吐便秘或下痢食思缺乏噁心有併發腸症者經過及預後由原因而不一定類症慢性胃加答兒治法宜施原由療法整理生活內服苦味藥貧血則服鐵劑嘔吐噯氣則服鎮痙劑施精神療法又虛弱之小兒與人工營養之小兒宜擇良母乳調節授乳時間每二三時決不可哺乳多量若不得良母乳則用牛乳和麥漿犢肉羹汁或膠溶液蛋白水之混和且須令肛門清潔勿使濕爛或濕疹等藥方黨參草果乾薑炙甘草厚朴橘皮白朮各一錢茯苓二錢麥芽四錢上水煎服補脾飲滑石六錢麥芽二兩當歸肉桂茴香丁香各一錢上研為散分十包一日三次每次一包食後服用特方牛膽膏一分飴糖二錢五分上混和一日三次分服蒲公英八錢水十五兩上煎朝夕各服一兩五錢至三兩番木鱉酒一分苦味酒二分上每食後服十五滴泌尿器病小便不通膀胱麻痹原因為全身衰弱脊髓疾患膀胱損傷及久忍放尿等症候閉尿或利尿不全或利尿時起疼痛或起尿淋瀝症經過及預後由原因而不一定治法輕症施膀胱按摩每二時或四時使放尿其他行冷水按摩冷水坐浴冷水灌溉法重症行加的的兒排尿藥方黃柏三錢知母澤瀉各一錢五分滑石茯苓各二錢上水煎服東垣導氣除濕湯特方黴麥膏二分六釐茴香油糖五分二釐上為六包一日三次每服一包甜杏仁油八滴斑蝥酒一滴上入膠囊一日二三次遺尿小便自利原因為全身虛弱營養不良膀胱弛緩與括約筋衰弱驅尿筋痙攣等其他腸蟲包莖炎症等治法行全身強壯法行冷水浴或溫水浴貧血者與小兒服鐵劑或行電氣療法貼感傳電氣二極於會陰部或膀胱通強電流每日行二三分時其他腸蟲用驅蟲劑包莖可施手術藥方白芍一錢黃耆一錢二分黨參破故紙各七分升麻益智仁各五分五味子三分官桂二分上水煎服束氣湯特方番木鱉膏二釐六毫樟腦一分白糖八分上分十包一日三次每次十包黴麥一分水八十分糖漿二十分上每三時服一食匙陰痿原因為情欲缺乏陰莖器質變性恐懼憤怒羞恥等之精神感動房事過度手淫慢性淋白濁脊髓勞糖尿病等症候男子交接不能或射精不能或精液內失卻精蟲等預後由原因而不一定治法施原因療法用興奮劑鐵劑行電氣療法水治法藥方熟地五錢當歸三錢甘草一錢乾薑二錢上水煎服景岳當歸二錢五分熟地三錢枸杞一錢炙草五分杜仲一錢牛膝一錢肉桂五分上水煎服大營煎特方樟腦八釐甘草末適宜上分六包一日三次每次一包夢遺遺精原因為情欲興奮手淫睡眠中膀胱緊滿陰部刺激腸管充實或重病後衰弱與膀胱結石包皮結石痔瘡脊髓勞等症候睡眠中得極快夢境以致遺精遂發貧血倦怠心悸癡呆痙攣與頭部壓重心思苦悶意志變易記憶減弱等治法戒手淫正品行節飲食減晚餐禁閱淫書淫戲就田舍與山地就寢用硬褥輕衾宜早起其他禁生殖器興奮及身心過勞用乳療法冷水浴強壯劑電氣等藥方龍骨蓮鬚芡實烏梅肉等分上為末山藥糊丸小豆大每服三十丸米飲下公選良方特方黴麥二分六釐白糖一錢三分上為十包每日服三包至五包樟腦一分三釐蓽澄茄末蓽澄茄膏各二錢上為六十丸一日四粒乃至十二粒白濁膀胱加答兒原因為腐敗細菌自外侵入如不潔消息子送入或續發於附近之炎症如尿道炎波及其他之誘因為下腹感寒腎積尿外傷與松香油誤用及飲用酸敗酒類等症候急性症膀胱部疼痛排尿時尤劇烈尿意頻數尿帶紅色而呈酸性或亞爾加里性以顯微鏡窺見膀胱上皮有無數之細菌甚者惡寒發熱頭痛眩暈精神恍惚慢性症則以上諸候甚輕微經過及預後急性症數日而治愈慢性症多不治以其病原不能除去也類症腎盂炎治法以原因療法為主急性症當安靜身體於膀胱部行溫罨法或芳香巴布於下腹部發熱用解熱劑惡寒發作用芳香性飲料劇痛宜行持長性溫浴或貼置水蛭於會陰部尿意頻數可用麻醉劑之內服或坐藥或灌腸此症之續發於淋疾者禁尿道注洗進淡泊之食餌戒飲酒多飲液汁而牛乳療法最適宜慢性症宜洗滌膀胱行全身溫浴或坐浴且治療淋疾宜消毒加的的兒為至要藥方滑石二錢木通茯苓車前子瞿麥各一錢上水煎服萬全木通散豬苓澤瀉各二錢滑石三錢甘草八分木通一錢車前子二錢上水煎服特方蓽澄茄末一錢三分至二錢六分蓽澄茄膏一錢三分上為五十丸一日三次每次三丸膽礬五釐明礬五分水五兩上注入尿道運動器病萎黃病黃胖原因為赤血球減少而起多發於十四歲至二十三四歲之婦女其誘因為營養不良心身過勞手淫白帶梅毒久痢與不良之空氣不健康之坐業等症候發現一般貧血症狀皮膚及黏膜呈蒼白色起下肢沉重頭痛眩暈腎部壓重食欲減退時發胃痛呼吸困難頸靜脈下部放騷雜音其他月經不調或減少或竟閉止等症經過遲緩預後概良重者經一二月後而全治類症慢性腎臟炎梅毒初期肺勞僧帽瓣不全閉鎖治法轉地療養改良食品及生活法行海水浴內服鐵劑藥方鐵屑五分麥粉二兩葛粉二兩硫黃五分上為散每服一錢日三次白湯下黃胖散茵陳蒿四錢麥芽大黃各三錢枳實二兩上水法為丸每服三錢茵陳丸特方鐵鏽或鐵屑細粉一錢大黃末一錢苦參末一錢薑末四分上糖漿和丸桐子大每飯後服一二粒日二三次消渴糖尿病原因為遺傳及麥酒澱粉糖類之過食精神過勞與吸菸梅毒腦病頭部外傷胰臟疾患等又有一種過性糖尿病尿中僅含極微之糖粉暫時即行消散症候發異常之飢渴排尿過多一晝夜間尿量自一百五十兩至二百五十兩其尿澄清如水呈淡黃色而含有多量糖分此外起倦怠頭痛坐骨神經痛不眠皮膚瘙癢屢生癤腫或癰腫呼吸帶果實臭色欲減損內障網膜炎嗜眠等症經過一年至十年類症單尿崩脊髓勞預後如不能除去其病原則不良治法運動於新鮮空氣中依法操練筋肉每日行入浴嚴守飲食攝生常食肉類如肉貝鳥卵等禁糖粉質即含澱粉或糖質之物如飯麵包豆類及甘味果實其他轉地靜養等藥方豬苓茯苓阿膠滑石澤瀉各二錢五分上水煎服豬苓湯特方阿片四釐甘草粉甘草膏各適宜上為十丸一日四五粒黴麥膏四分甘草膏適宜上為二十丸一日三次每次一粒風痛尿酸性關節炎原因為遺傳性四十歲以上而發生者為多或安居無事飽食暖衣亦為其主因其他為外傷感冒房事過度等症候發關節劇痛手足肩膝坐骨手指足趾等起丹毒樣潮紅惡寒發熱心機亢進尿量減少腸胃障害等其痛夜間甚於日中休止數日或數年而再發經過遲緩預後無生命之危險維不易治愈類症肉痹筋痹白虎風痛治法節飲食戒菸酒更變日常職務取動植兩性之混食及果品飲茶及含亞爾加里性礦泉其他屋外運動疼痛用麻醉劑膿瘍貼琶布急性命安臥靜養與以流動性之飲料可保持患處於高位又鹽水浴溫泉浴按摩法均有效藥方紅花白芷防風各五錢威靈仙三錢上加酒少許煎服取汗公選良方當歸三錢秦艽二錢防風一錢五分川芎羌活各一錢車前子黃芩枳殼各五分上水煎服痛風主方麻黃甘草川烏各五分芍藥黃耆各一錢五分上水煎服金匱烏頭湯特方烏頭酒二分橙皮糖漿五分上一日三次每次一茶匙莨菪根膏二分豚脂二十分上塗布神經系病中風腦出血原因本病由腦部小動脈管生動脈瘤驟然破裂而發者其誘因為血壓亢進過度勞動心臟諸病暴飲暴食嚴寒酷暑精神興奮等又為遺傳素因以四十歲以上者為多在四十歲以下者概為梅毒其他白血病壞血病紫斑病惡性貧血等症候卒然而來往往人事不省沉沉昏睡或頭痛耳鳴眼大閃發四肢厥冷言語困難脈搏遲慢硬實頰部口唇同時弛緩顏面歪斜呼吸聲長而發鼾聲半身不遂等重者有發作時即死者或卒倒呼吸疾速喉頭氣管等部因唾液黏液壅塞而起喘鳴遲脈變速眼球陷落角膜溷濁數時或一二日乃死然有死後復醒者經過一日至數年不定類症腦血管血塞及栓塞酒精及鴉片中毒心脂化重症腦充血預後概不良年老者尤不易治治法防此症之法戒身心興奮禁酒茶咖啡與房事調理便通發作時當命安臥高舉上半身清潔皮膚注意臥床衾褥頭痛貼置冰囊年壯者行刺絡或灌腸或投下劑或貼芥子泥於胸部脈搏成險象者服興奮藥麻痹則施行電氣療法及按摩其他注意一般攝生法亦最要者也藥方麻黃五分獨活四分細辛二分黃耆黃芩各一錢上水煎服數劑千金三黃湯川芎甘草白芷各一錢細辛五分薄荷一錢五分上為散每服一錢清茶下通關散特方大黃十分水二百分煎糖漿十五分上一日四次每次一食匙麝香樟腦各二分六釐卵黃一枚胡麻子漿七兩上灌腸癲癇羊癇風原因為神經病素質或末梢神經有障礙其誘因為身心過勞恐怖鉛毒房事過度手淫絛蟲暴飲腺病梅毒便秘等症候初發一種特發之感覺自上向上次覺心窩窘迫眩暈繼則全身痙攣卒倒於地不省人事顏面暗黑大聲叫號口起泡沫瞳孔散大等經過發作之稀密雖各不同而全經過大率遺傳終身預後概良亦難全治但以反射的起此症者或有治愈類症腦病患癲癇樣發作臟躁卒中急癇治法宜安靜精神戒房事過度尤忌手淫行一般之攝生法忌苛烈性之飲食物且宜改良其體質又發作時防身體負傷且以布片纏絡木片插入齒間可防咬舌其他續發於梅毒或鉛中毒者宜各施原因之治療藥方茯神黃連各二錢棗仁石菖蒲柏仁遠志各一錢甘草五分上水煎服痰壅加制南星薑汁清神湯特方甘松末艾葉末各二錢六分上為十包每四時一包臟躁歇斯的里原因為遺傳精神病及罪人奇人等子孫易發之其他思慮過度貧血萎黃病月經異常生殖器病反射作用等且多發於壯年之婦女症候此症奇妙變幻無一定之情狀如耳舌鼻眼感觸過敏且起色盲此五官之障害也全身半身或一局部之知覺亡矣而取金屬板貼之於其一側知覺亡失部得使於移轉於他側其他皮膚過敏亦有發於各部而最易起於卵巢部所為卵巢痛是也又有諸神經痛此知覺之障害也麻痹痙攣攣縮此運動之障害也余如噁心嘔吐吞酸嘈雜等經過數日至數年預後良但難全治治法選易於消化之食品行適宜之運動避精神之感動當怡情于山水花木間與二三知己同遊行溫浴或冷浴用鎮痙劑其他可行電氣療法藥方茯神懷山藥各三錢黨參黃芩桔梗各一錢五分遠志辰砂甘草各一錢木香八分麝香一分上為散每服一錢開水下妙香散特方甘松酒阿魏酒各一錢苦味酒四分砂糖適宜上一日三次分服偏頭痛半頭風原因本病多發於十五歲以上之婦女為神經衰弱便秘貧血萎黃病悲哀憤怒臟躁月經異常瘧疾等症候初覺不快欠伸噁心眩暈耳鳴眼火閃發次發偏側頭痛或緩或急起嘔吐及音響光線等知覺過敏又有痙攣性與麻痹性偏頭痛之二種經過遲緩數年預後概良惟不易全治治法貧血宜用鐵劑與砒石劑便秘宜下劑施頭部冷罨法電氣療法以薄荷油塗布前額其他一般食物攝生安息靜養禁酒製欲等藥方肉桂一分麝香二釐細辛辛夷各五釐胡椒十粒上為末用棗肉為餅貼兩額川芎一錢五分細辛五分白芷一錢甘草六分生薑五片茶一撮上水煎服芎辛湯特方黴麥膏二分六釐甘草粉適宜上為二十丸一日十次每次一粒乃至二粒眩暈頭目眩治法勿取飲食物靜臥暗室閉目休息處方如下藥方大黃荊芥防風等分上水煎服荊黃湯特方甘松酒十分龍膽酒愈瘡木酒各五分上每二時十滴乃至二十滴和水服之中暑日射病原因長受酷暑飲食不潔等症候面紅氣促頭痛眩暈譫語卒倒好睡周身發痙體溫升騰脈搏細小等治法靜臥冷所脫卻衣服與以適宜之冷飲料與冷酒施冷罨法用熱水洗足或與以瀉劑藥方香薷厚朴各三錢茯苓扁豆各二錢丁香甘草各五分上為粗末每服三錢酒水各半煎冷服朱氏水沉湯特方蓖麻油五錢上和水少許一次服盡輕粉八釐白糖八分上為十包一日三次每次一包小兒
