front:
  text: 自序醫學為捍衛人類生存之一端有人類即需求醫學因人體之仇敵大部屬於疾病其防禦方法亦隨人類之繁殖而愈感切要吾人有史以來醫學之演進頗多可觀上古有神農軒轅岐伯等之發明中古有張機華佗之精進近古則有醫學組織如唐貞觀之世諸州置醫藥博士及學生宋設醫官院釐訂醫學圖籍而民間之治療方法亦勃然興起及夫元明清以迄現在代有名醫各科之著作如林在社會進化過程中吾國固有之醫學亦占相當重要之地位惟自西醫流入以來常有中西醫藥之爭議習西醫者必非中醫擅中醫者多斥西學以內科為尤甚謂西醫內科因藥不逮中醫之穩妥中醫內臟之解剖不及西醫之詳盡各是其說是皆不溯厥根源互相貫通為學術上推進之新機且人類愈繁殖物質文明愈進步致病之原因愈形複雜吾人健康被劫奪之機會更多宜如何融會古今中外醫學以抵抗與消滅病菌之襲擊謀目今社會組織中吾國醫藥之位置斯有冀夫吾國醫界不分畛域辨晰異同取彼之長以補我之不足微特病者之幸福可期而於人類之繁盛固有莫大之關係也本編匯參中西病理多采西學處方均用中藥於內科諸病分節敘述學說務求其新文辭惟擇淺顯使讀者開卷瞭然藉貢通俗治療之助亦聊以作革新國醫之先驅云爾丙辰春正月編者識
